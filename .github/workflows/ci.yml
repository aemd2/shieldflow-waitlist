name: CI

# A prospect assessing us asked what security scanning runs in CI. The honest
# answer was "there is no CI", which is a poor look for a compliance product and
# is also evidence we need for our own SOC 2 later. This is that pipeline.
#
# Deliberately not included: container scanning. Nothing here is containerised,
# so a container scan would report "0 findings" on nothing at all. Saying that
# plainly is worth more than theatre.

on:
  push:
    branches: ["**"]
  pull_request:
  # Run it by hand from the Actions tab. Needed the first time the Supabase
  # secrets were added: without this there was no way to re-run CI except by
  # pushing an empty commit.
  workflow_dispatch:
  schedule:
    # Dependency advisories land after a commit does, so re-run weekly on main.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint .
      - name: Check logic branch cases
        # Pure decision logic for the identity checks — the branches that must
        # never wrongly PASS. No database or network needed.
        run: npx tsx lib/identity-checks.cases.ts
      - name: Build
        # Build last: it is the slowest step, so failing fast on types and lint
        # gives a quicker signal.
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

  dependencies:
    name: Dependency advisories
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: npm audit (high and above blocks)
        # This started at `critical` only, because the tree had 3 critical and 8
        # high advisories — including a Next.js App Router middleware bypass,
        # which mattered here because the auth gate IS middleware
        # (lib/supabase/middleware.ts). `npm audit fix` closed 16 of 17, leaving
        # zod < 4.6.6, whose fix meant the zod 3 -> 4 major migration. Blocking
        # on `high` then would have left the pipeline permanently red, and a
        # permanently red pipeline gets ignored.
        #
        # zod 4.6.7 is in (#7). The tree is now clean at every level, so the
        # gate moves to `high` as planned.
        #
        # Deliberately not `moderate` or `low`, even though both would pass
        # today: a transitive low advisory lands in a Next.js tree often, and
        # most are unreachable from this code. The point of the gate is that red
        # means stop — a threshold that cries wolf stops being read, which is
        # how the gate fails rather than how it protects.
        run: npm audit --audit-level=high
      - name: Report moderate and below (non-blocking)
        # Everything under the gate still gets printed, so nothing is hidden —
        # it just doesn't fail the build.
        if: always()
        run: npm audit || true

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: a secret committed and later removed is still exposed,
          # and a shallow clone would miss it.
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  isolation:
    name: Tenant isolation
    runs-on: ubuntu-latest
    # Needs real credentials, so it cannot run on a fork's pull request.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Prove one workspace cannot read another
        # Creates two throwaway workspaces, signs in as both through the ANON
        # key (never the service role, which would bypass RLS and pass
        # regardless), tries to read and write across the boundary, then deletes
        # them. Skipped with a warning rather than silently passing if the
        # secrets are absent.
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::Supabase secrets not configured — tenant isolation test skipped"
            exit 0
          fi
          node scripts/tenant-isolation.test.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Prove adding and removing a framework works
        # Runs as a real signed-in user through the anon key. The previous test
        # of this feature used the service role, which bypasses RLS — so it
        # passed a feature that had never once worked in production.
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::Supabase secrets not configured — framework scope test skipped"
            exit 0
          fi
          node scripts/framework-scope.test.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
